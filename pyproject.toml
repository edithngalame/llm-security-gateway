[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-gateway"
version = "0.2.1"
description = "Source-aware prompt injection and data-leak protection for LLM applications"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# The fine-tuned classifier (v0.3): ONNX Runtime, no PyTorch needed
ml = [
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface_hub>=0.23",
  "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gateway = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
